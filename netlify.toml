# Netlify config for the React frontend (the Django API is hosted separately).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html so /login, /rooms etc. work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
