# Render Blueprint: Django API only (free plan); the React frontend is on Netlify (see netlify.toml).
# Database: use a free external Postgres (e.g. Neon) and paste its connection string
# into DATABASE_URL. Deploy: push to GitHub, then Render > New > Blueprint.
services:
  - type: web
    name: guesthouse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Set these after the frontend URL exists, e.g. https://guesthouse-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # First admin login, created by build.sh
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
